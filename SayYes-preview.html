</style></head><body><div id="app"><p class="notice">Загрузка SayYes… Для работы требуется JavaScript.</p></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>(()=>{const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tbilisi'});
const mins=t=>{if(!/^\d{2}:\d{2}$/.test(t))throw Error('Неверное время');const [h,m]=t.split(':').map(Number);if(h>23||m>59)throw Error('Неверное время');return h*60+m;};
const time=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const num=(v,min=0,max=1e9)=>{const n=Number(v);if(!Number.isFinite(n)||n<min||n>max)throw Error('Проверьте числовые значения');return n;};
const required=v=>{const s=String(v??'').trim();if(!s)throw Error('Заполните обязательные поля');return s;};
const validDate=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||new Date(d+'T12:00:00Z').toISOString().slice(0,10)!==d)throw Error('Неверная дата');return d;};
function initial(){return upgrade({employees:['Анна','Мария','Елена','Нино','София','Тамара','Екатерина'].map((name,i)=>({id:String(i+1),name,role:i<3?'Стилист':i<5?'Нейл-мастер':'Бровист'})),services:[{id:'1',name:'Стрижка и укладка',price:80,duration:60},{id:'2',name:'Окрашивание',price:180,duration:120},{id:'3',name:'Маникюр с покрытием',price:65,duration:90},{id:'4',name:'Оформление бровей',price:40,duration:30}]});}
function upgrade(s){for(const k of ['employees','services','clients','appointments','schedules','shifts','cash','advances','expenses','products','purchases','movements','suppliers','warehouses','workplaces','promotions','audit','categories','units','productTypes'])s[k]??=[];
 s.settings={name:'SayYes',address:'',phone:'',email:'',slug:'sayyes',online:true,slotStep:30,leadHours:0,loyaltyPercent:0,reviewGoogle:'',reviewOther:'',...s.settings};
 if(!s.warehouses.length)s.warehouses.push({id:'main',name:'Основной склад'});
 for(const e of s.employees){e.commission??=0;e.active??=true;}
 for(const c of s.clients){c.tags??='';c.source??='Салон';c.note??='';c.blocked??=false;}
 for(const v of s.services){v.category??='Общее';v.active??=true;v.materials??=[];v.employeeIds??=[];v.baseCost??=0;}
 for(const [key,values] of [['categories',s.services.map(v=>v.category)],['units',['шт','мл','г',...s.products.map(p=>p.unit)]],['productTypes',['Материалы',...s.products.map(p=>p.category)]]])for(const name of new Set(values.filter(Boolean)))if(!s[key].some(x=>x.name===name))s[key].push({id:uid(),name});
 for(const p of s.products){p.brand??='';p.lossFactor??=1;}
 for(const a of s.appointments)if(a.status==='paid'){a.amount??=a.price;a.paidDate??=a.date;}
 for(const p of s.purchases)p.locations??={[p.warehouseId]:p.remaining};
 return s;
}
function schedule(s,employeeId,date){return s.schedules.find(x=>x.employeeId===employeeId&&x.date===date)||{employeeId,date,start:'10:00',end:'20:00',off:false,breakStart:'',breakEnd:''};}
function slots(s,employeeId,serviceId,date,publicMode=false){const service=s.services.find(x=>x.id===serviceId&&x.active),e=s.employees.find(x=>x.id===employeeId&&x.active);if(!service||!e||service.employeeIds.length&&!service.employeeIds.includes(employeeId))return [];
 const g=schedule(s,employeeId,date);if(g.off||publicMode&&!s.settings.online)return [];const result=[];
 for(let t=mins(g.start);t+service.duration<=mins(g.end);t+=Number(s.settings.slotStep)){
 if(g.breakStart&&g.breakEnd&&t<mins(g.breakEnd)&&t+service.duration>mins(g.breakStart))continue;
 if(s.appointments.some(a=>a.employeeId===employeeId&&a.date===date&&a.status!=='cancelled'&&t<a.start+a.duration&&t+service.duration>a.start))continue;
 if(publicMode&&new Date(`${date}T${time(t)}:00+04:00`).getTime()<Date.now()+s.settings.leadHours*3600000)continue;
 result.push(time(t));}return result;}
function stock(s,productId,warehouseId){return s.movements.filter(m=>m.productId===productId&&(!warehouseId||m.warehouseId===warehouseId)).reduce((n,m)=>n+m.qty,0);}
function cashBalance(s,shift=s.shifts.find(x=>!x.closedAt)){return shift?shift.opening+s.cash.filter(c=>c.shiftId===shift.id).reduce((n,c)=>n+c.amount,0):0;}
function payroll(s,employeeId,from,to){const receipts=s.appointments.filter(a=>a.employeeId===employeeId&&a.status==='paid'&&(a.paidDate||a.date)>=from&&(a.paidDate||a.date)<=to);const earned=receipts.reduce((n,a)=>n+(a.commissionAmount||0),0),advance=s.advances.filter(a=>a.employeeId===employeeId&&a.date>=from&&a.date<=to).reduce((n,a)=>n+a.amount,0);return {earned,advance,due:earned-advance};}
function mutate(s,action,b){upgrade(s);const id=uid(),date=today(),find=(k,key)=>{const x=s[k].find(x=>x.id===key);if(!x)throw Error('Запись не найдена');return x;};
 if(['categories','units','productTypes'].includes(action)){const name=required(b.name);if(s[action].some(x=>x.id!==b.id&&x.name.toLowerCase()===name.toLowerCase()))throw Error('Такое название уже существует');if(b.id){const entry=find(action,b.id),old=entry.name;entry.name=name;const collection=action==='categories'?s.services:s.products,key=action==='units'?'unit':'category';for(const x of collection)if(x[key]===old)x[key]=name;}else s[action].push({id,name});
 }else if(action==='service-order'){const index=s.services.findIndex(v=>v.id===b.id),direction=Number(b.direction);if(index<0||![-1,1].includes(direction))throw Error('Неверный порядок');const target=index+direction;if(target>=0&&target<s.services.length)[s.services[index],s.services[target]]=[s.services[target],s.services[index]];
 }else if(['employees','clients','services','products','suppliers','warehouses','workplaces','promotions'].includes(action)){
 let v={id:b.id||id,name:required(b.name)};
 if(action==='employees')Object.assign(v,{role:required(b.role||'Мастер'),commission:num(b.commission??0,0,100),active:b.active!==false});
 if(action==='clients'){const phone=required(b.phone);if(s.clients.some(c=>c.id!==b.id&&c.phone===phone))throw Error('Клиент с этим телефоном уже существует');Object.assign(v,{phone,tags:String(b.tags||''),source:String(b.source||'Салон'),note:String(b.note||''),blocked:!!b.blocked});}
 if(action==='services'){const duration=num(b.duration,15,480);if(!Number.isInteger(duration))throw Error('Длительность должна быть целой');Object.assign(v,{price:num(b.price),duration,category:required(b.category||'Общее'),active:b.active!==false,baseCost:num(b.baseCost||0),employeeIds:b.employeeIds||[],materials:b.materials||[]});for(const m of v.materials){find('products',m.productId);num(m.qty,0.001);}for(const e of v.employeeIds)find('employees',e);}
 if(action==='products')Object.assign(v,{sku:String(b.sku||''),category:String(b.category||'Материалы'),unit:required(b.unit||'шт'),price:num(b.price||0),threshold:num(b.threshold||0),brand:String(b.brand||''),lossFactor:num(b.lossFactor??1,1,10)});
 if(action==='suppliers')Object.assign(v,{phone:String(b.phone||''),note:String(b.note||'')});
 if(action==='workplaces')Object.assign(v,{kind:String(b.kind||'Кресло'),x:num(b.x||0,0,100),y:num(b.y||0,0,100)});
 if(action==='promotions')Object.assign(v,{discount:num(b.discount,0,100),start:validDate(b.start),end:validDate(b.end),active:b.active!==false});
 if(action==='promotions'&&v.end<v.start)throw Error('Проверьте период акции');
 if(b.id)Object.assign(find(action,b.id),v);else s[action].push(v);
 }else if(action==='schedule'){

 const cs=state.clients.filter(c=>{const v=paid().filter(a=>a.clientId===c.id),last=v.map(a=>a.date).sort().at(-1);return (c.name+' '+c.phone+' '+c.tags).toLowerCase().includes(query.toLowerCase())&&(!sourceFilter||c.source===sourceFilter)&&(!tagFilter||c.tags.split(',').map(t=>t.trim()).includes(tagFilter))&&(!filter||filter==='blocked'&&c.blocked||filter==='regular'&&v.length>=2||filter==='potential'&&!v.length||filter==='sleep'&&last&&last<addDays(today(),-60));});return panel('Клиентская база',table(['Имя','Телефон','Теги / источник','Визиты','Последний визит','Средний чек',''],cs.map(c=>{const v=paid().filter(a=>a.clientId===c.id);return [btn(esc(c.name),`data-client="${c.id}"`),esc(c.phone),`${esc(c.tags)}<small>${esc(c.source)}</small>`,v.length,v.map(a=>a.date).sort().at(-1)||'—',money(v.length?sum(v,'amount')/v.length:0),edit('clients',c.id)];})),`<input id="search" placeholder="Имя, телефон или тег" value="${esc(query)}"><select id="filter">${[['','Все'],['regular','Постоянные (2+ визита)'],['sleep','Спящие (60+ дней)'],['potential','Без оплаченных визитов'],['blocked','Заблокированные']].map(([id,n])=>`<option value="${id}" ${filter===id?'selected':''}>${n}</option>`).join('')}</select>`+clientFilters()+add('clients','Клиент')+btn('Импорт CSV','data-page="import"')+btn('Экспорт CSV','data-export="clients"'));}

 if(page==='workplaces'||page==='floor')return panel('Рабочие места',page==='floor'?`<div class="floor-plan">${state.workplaces.map(w=>`<button style="left:${w.x}%;top:${w.y}%" data-form="workplaces" data-id="${w.id}">▱<br>${esc(w.name)}</button>`).join('')}</div>`:table(['Название','Тип','Положение на плане',''],state.workplaces.map(w=>[esc(w.name),esc(w.kind),`${w.x}% / ${w.y}%`,edit('workplaces',w.id)])),add('workplaces','Рабочее место'))+notice('Рабочее место можно выбрать при создании записи. Пересекающиеся записи на одно место блокируются. Положение на плане меняется в карточке.');

function monthControl(){return `<input id="period" type="month" value="${period}" aria-label="Месяц">`;}
function employeeControl(){return `<select id="employee-filter" aria-label="Мастер"><option value="">Все мастера</option>${opts(state.employees,employee)}</select>`;}
function cashPanel(){const s=shift();return panel('Кассовая смена',`<div class="padded"><h2>${s?'В кассе: '+money(cashBalance(state)):'Смена закрыта'}</h2><p class="muted">${s?'Открыта '+s.date+' · На открытие '+money(s.opening):'Откройте смену перед приёмом оплаты.'}</p></div>`,s?btn('Внести / изъять','data-form="cash"')+btn('Закрыть смену','data-form="shift-close"','primary'):add('shift-open','Открыть смену'));}
function inventory(){const tabs=page==='stock'?['Номенклатура','Партии','Движения','Перемещения','Поставщики','Типы продуктов','Склады']:[];const active=tab||tabs[0];let content='';

 else if(page==='transfers'||active==='Движения'||active==='Перемещения')content=table(['Дата','Товар','Склад','Количество','Основание'],state.movements.filter(m=>page!=='transfers'&&active!=='Перемещения'||m.reason==='Перемещение').slice().reverse().map(m=>[m.date,nameOf('products',m.productId),nameOf('warehouses',m.warehouseId),m.qty,esc(m.reason)]));
 else if(active==='Поставщики')content=table(['Поставщик','Телефон','Примечание',''],state.suppliers.map(s=>[esc(s.name),esc(s.phone),esc(s.note),edit('suppliers',s.id)]));
 else if(active==='Склады')content=table(['Склад',''],state.warehouses.map(w=>[esc(w.name),edit('warehouses',w.id)]));
 else content=table(['Товар / бренд','Категория / штрихкод','Остаток','Порог','Цена продажи',''],state.products.filter(p=>(p.name+' '+p.brand+' '+p.sku).toLowerCase().includes(query.toLowerCase())).map(p=>[`${esc(p.name)}<small>${esc(p.brand)}</small>`,`${esc(p.category)}<small>${esc(p.sku)}</small>`,`${stock(state,p.id)} ${esc(p.unit)} ${stock(state,p.id)<=p.threshold?'<span class="badge">Мало</span>':''}`,p.threshold,money(p.price),edit('products',p.id)]));
 const action=page==='purchases'||active==='Партии'?'purchase':page==='transfers'||active==='Перемещения'?'transfer':active==='Типы продуктов'?'productTypes':active==='Поставщики'?'suppliers':active==='Склады'?'warehouses':'products';
 return panel(title(page),`<div class="tabs">${tabs.map(t=>btn(t,`data-tab="${t}"`,t===active?'primary':'secondary')).join('')}</div>${content}`,`<input id="search" placeholder="Название, бренд, штрихкод" value="${esc(query)}">`+btn('CSV','data-export="stock"')+add(action,action==='purchase'?'Принять товар':action==='transfer'?'Переместить':'Добавить'))+notice('Закупки увеличивают остатки. Материалы списываются с основного склада при оплате услуги; стоимость расхода считается по FIFO. Продажа товаров отдельным чеком пока не подключена.');}
function analytics(){const r=receiptsInMonth(),revenue=sum(r,'amount'),cost=sum(r,'materialCost')+sum(r,'baseCost'),salary=sum(r,'commissionAmount'),expenses=state.expenses.filter(e=>e.date.startsWith(period));return panel('Финансовый результат',stats([['ВЫРУЧКА',money(revenue)],['МАТЕРИАЛЫ И БАЗОВЫЕ РАСХОДЫ',money(cost)],['НАЧИСЛЕНО МАСТЕРАМ',money(salary)],['РЕЗУЛЬТАТ ПО ВВЕДЁННЫМ ДАННЫМ',money(revenue-cost-salary-sum(expenses,'amount'))]])+notice('Результат учитывает только введённые расходы. Закупки не списываются повторно: себестоимость материалов учитывается при расходе.')+`<div class="chart padded">${Array.from({length:31},(_,i)=>{const d=period+'-'+String(i+1).padStart(2,'0'),v=sum(r.filter(a=>(a.paidDate||a.date)===d),'amount');return `<div title="${esc(d)}: ${money(v)}"><span style="height:${Math.max(2,revenue?v/revenue*160:2)}px"></span><small>${i+1}</small></div>`;}).join('')}</div>`,monthControl())+panel('Расходы',table(['Дата','Статья','Сумма'],expenses.map(e=>[e.date,esc(e.name),money(e.amount)])),add('expenses','Расход'));}

 if(type==='schedule'){v=schedule(state,id,day);f=field('date','Дата',day,'date','required')+field('start','Начало',v.start,'time','required')+field('end','Конец',v.end,'time','required')+field('breakStart','Начало перерыва',v.breakStart,'time')+field('breakEnd','Конец перерыва',v.breakEnd,'time')+check('off','Выходной',v.off);}
 if(type==='payment'){const a=state.appointments.find(a=>a.id===id);f=`<p>${esc(a.name)} · ${esc(a.service)} · ${money(a.price)}</p>`+select('method','Способ оплаты',[{id:'cash',name:'Наличные'},{id:'card',name:'Карта / безналичные'}])+select('promotionId','Применить акцию',state.promotions.filter(p=>p.active&&today()>=p.start&&today()<=p.end).map(p=>({...p,name:p.name+' −'+p.discount+'%'})),'',true)+notice('Это внутренний учёт оплаты. Деньги с карты не списываются.');}
 if(type==='advances')f=select('employeeId','Мастер',state.employees)+field('date','Дата',today(),'date','required')+field('amount','Выдано, ₾','','number','min="0.01" step="0.01" required')+field('note','Примечание');
 if(type==='expenses')f=nameField()+field('date','Дата',today(),'date','required')+field('amount','Сумма, ₾','','number','min="0.01" step="0.01" required');
 if(type==='cash')f=select('kind','Операция',[{id:'in',name:'Внести'},{id:'out',name:'Изъять'}])+field('amount','Сумма, ₾','','number','min="0.01" step="0.01" required')+field('reason','Основание','','text','required');
 if(type==='shift-open')f=field('opening','Наличные на открытие, ₾',0,'number','min="0" step="0.01" required');

 if(type==='suppliers')f=nameField()+field('phone','Телефон',v.phone||'')+field('note','Примечание',v.note||'');
 if(type==='warehouses')f=nameField();
 if(type==='workplaces')f=nameField()+field('kind','Тип',v.kind||'Кресло')+field('x','Положение по горизонтали, %',v.x||10,'number','min="0" max="100"')+field('y','Положение по вертикали, %',v.y||10,'number','min="0" max="100"');
 if(type==='promotions')f=nameField()+field('discount','Скидка, %',v.discount||10,'number','min="0" max="100"')+field('start','Начало',v.start||today(),'date','required')+field('end','Окончание',v.end||addDays(today(),30),'date','required')+check('active','Активна',v.active!==false);
 if(type==='purchase')f=select('productId','Товар',state.products)+select('warehouseId','Склад',state.warehouses,'main')+select('supplierId','Поставщик',state.suppliers,'',true)+field('date','Дата',today(),'date','required')+field('qty','Количество','','number','min="0.001" step="0.001" required')+field('cost','Цена закупки за единицу, ₾','','number','min="0" step="0.01" required');
 if(type==='transfer')f=select('productId','Товар',state.products)+select('from','Со склада',state.warehouses)+select('to','На склад',state.warehouses)+field('qty','Количество','','number','min="0.001" step="0.001" required');
 modal.innerHTML=`<div class="modal-heading"><h2>${formTitles[type]}</h2><button data-close aria-label="Закрыть">×</button></div><form>${f}${type==='appointments'?'':'<p class="form-error" role="alert"></p><button class="primary" type="submit">Сохранить</button>'}</form>`;

function bindForm(form,type,id=''){if(type==='appointments'){
 const refresh=()=>{const data=Object.fromEntries(new FormData(form)),select=form.elements.time;const available=slots(state,data.employeeId,data.serviceId,data.date,page==='book');select.innerHTML=available.length?available.map(t=>`<option>${t}</option>`).join(''):'<option value="">Нет свободного времени</option>';form.querySelector('[type=submit]').disabled=!available.length;};
 ['serviceId','employeeId','date'].forEach(k=>form.elements[k].addEventListener('change',refresh));refresh();}
 form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector('[type=submit]');submit.disabled=true;try{const b=Object.fromEntries(new FormData(form));form.querySelectorAll('[type=checkbox]').forEach(el=>b[el.name]=el.checked);
 if(id)b.id=id;if(type==='schedule')b.employeeId=id;if(type==='appointments')b.publicMode=page==='book';
 if(type==='services'){b.employeeIds=state.employees.filter(e=>b['employee:'+e.id]).map(e=>e.id);b.materials=state.products.filter(p=>Number(b['material:'+p.id])>0).map(p=>({productId:p.id,qty:Number(b['material:'+p.id])}));}
 if(type==='payment')b.status='paid';await post(type==='payment'?'status':type,b);modal.close();toast(type==='appointments'?'Запись создана':'Сохранено');}catch(e){form.querySelector('.form-error').textContent=e.message;}finally{submit.disabled=false;}};}
function render(){const publicPage=page==='book';app.innerHTML=`${publicPage?'':`<aside><a class="logo" href="#" data-page="dashboard">SayYes<span>BEAUTY WORKSPACE</span></a><div class="salon"><span class="avatar">S</span><div><b>${esc(state.settings.name)}</b><small>GEL ₾ · Тбилиси</small></div></div><input id="menu-search" placeholder="Поиск по меню…" aria-label="Поиск по меню"><nav>${groups.map(([label,...items])=>`<div class="nav-group"><div class="nav-label">${label}</div>${items.map(([id,icon,n])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span>${n}</button>`).join('')}</div>`).join('')}</nav><div class="demo">SayYes · Прототип</div></aside>`}<main class="${publicPage?'public-main':''}"><header><div class="breadcrumb">SayYes <span>/ ${title(page)}</span></div><div class="profile">₾ GEL <span class="avatar">SY</span></div></header><section class="content"><div class="heading"><div><p class="eyebrow">SAY YES TO A BEAUTIFUL DAY</p><h1>${title(page)}</h1></div>${publicPage?btn('← В CRM','data-page="dashboard"'):btn('Онлайн-запись ↗','data-page="book"')}</div>${body()}<footer>SayYes © ${new Date().getFullYear()}<span>Прототип · Данные и расчёты требуют проверки перед эксплуатацией</span></footer></section></main>`;
 bind();}
function bind(){document.querySelectorAll('[data-order]').forEach(b=>b.onclick=async()=>{try{await post('service-order',{id:b.dataset.order,direction:Number(b.dataset.direction)});}catch(e){toast(e.message);}});document.querySelectorAll('.calendar-scroll').forEach(el=>el.scrollTop=540);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.page);});document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>openForm(b.dataset.form,b.dataset.id));document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>{selectedClient=b.dataset.client;render();});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;view='day';render();});document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{day=addDays(day,Number(b.dataset.shift)*(view==='week'?7:1));render();});document.querySelector('[data-today]')?.addEventListener('click',()=>{day=today();render();});
 document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(!confirm('Отменить эту запись?'))return;try{await post('status',{id:b.dataset.cancel,status:'cancelled'});toast('Запись отменена');}catch(e){toast(e.message);}});
 document.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>{const a=state.appointments.find(a=>a.id===b.dataset.visit);modal.innerHTML=`<div class="modal-heading"><h2>${esc(a.name)}</h2><button data-close>×</button></div>${appointmentRows([a])}`;modal.querySelector('[data-close]').onclick=()=>modal.close();modal.querySelector('[data-form]')?.addEventListener('click',()=>{modal.close();openForm('payment',a.id);});modal.querySelector('[data-cancel]')?.addEventListener('click',async()=>{if(confirm('Отменить запись?')){await post('status',{id:a.id,status:'cancelled'});modal.close();}});modal.showModal();});
 for(const [id,fn] of [['day',v=>day=v],['employee-filter',v=>employee=v],['view',v=>view=v],['filter',v=>filter=v],['period',v=>period=v],['source-filter',v=>sourceFilter=v],['tag-filter',v=>tagFilter=v]])document.getElementById(id)?.addEventListener('change',e=>{if(!e.target.value&&['day','period'].includes(id))return;fn(e.target.value);render();});
 document.querySelector('#search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;query=e.target.value;render();const el=document.querySelector('#search');el.focus();el.setSelectionRange(pos,pos);});
 document.querySelector('#menu-search')?.addEventListener('input',e=>document.querySelectorAll('nav button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase())));
 document.querySelectorAll('form[data-action]').forEach(f=>bindForm(f,f.dataset.action));if(document.querySelector('#booking'))bindForm(document.querySelector('#booking'),'appointments');
 document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportCSV(b.dataset.export));document.querySelector('#import-file')?.addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;const rows=parseCSV(await f.text());const headers=rows.shift();if(!headers.includes('name')||!headers.includes('phone'))throw Error('Нужны колонки name и phone');await post('import-clients',{clients:rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,h==='phone'?(r[i]||'').replace(/^'(?=[+])/,''):r[i]||''])))});toast('Импорт завершён');}catch(e){toast(e.message);}});
 document.querySelector('[data-tour]')?.addEventListener('click',()=>showTour(0));}
function showTour(i){const steps=[['Панель','Здесь — выручка, кассовая смена и визиты.','dashboard'],['Календарь','Мастера по колонкам. Нажмите на визит для оплаты или отмены.','calendar'],['Графики','Настройте выходные и перерывы перед открытием онлайн-записи.','schedule'],['Услуги и материалы','Привяжите мастеров и расход материалов к услугам.','services'],['Клиенты','Откройте карточку клиента для истории и заметок.','clients'],['Настройки','Задайте данные салона и параметры записи.','settings']];const [h,t,target]=steps[i];go(target);modal.innerHTML=`<div class="modal-heading"><h2>${h}</h2><button data-close>×</button></div><p>${t}</p><p class="muted">Шаг ${i+1} из ${steps.length}</p>${btn(i===steps.length-1?'Готово':'Далее','data-next','primary')}`;modal.querySelector('[data-close]').onclick=()=>modal.close();modal.querySelector('[data-next]').onclick=()=>{modal.close();if(i<steps.length-1)showTour(i+1);};modal.showModal();}
function exportCSV(type){const rows=type==='stock'?[['name','brand','category','sku','unit','quantity','threshold','price'],...state.products.map(p=>[p.name,p.brand,p.category,p.sku,p.unit,stock(state,p.id),p.threshold,p.price])]:type==='clients'?[['name','phone','tags'],...state.clients.map(c=>[c.name,c.phone,c.tags])]:[['date','client','service','status','amount','method'],...state.appointments.map(a=>[a.date,a.name,a.service,a.status,a.amount??a.price,a.method||''])];const text='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='SayYes-'+type+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function parseCSV(text){const rows=[[]];let value='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){rows.at(-1).push(value);value='';}else if(c==='\n'&&!quoted){rows.at(-1).push(value.replace(/\r$/,''));rows.push([]);value='';}else value+=c;}if(quoted)throw Error('Незакрытая кавычка CSV');rows.at(-1).push(value.replace(/\r$/,''));return rows;}
load().catch(e=>{app.innerHTML=`<p class="notice">Не удалось загрузить SayYes: ${esc(e.message)}. Обновите страницу или откройте самостоятельный предпросмотр.</p>`;});
