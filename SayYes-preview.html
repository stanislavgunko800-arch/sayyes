</style></head><body><div id="app"><p class="notice">Загрузка SayYes… Для работы требуется JavaScript.</p></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>(()=>{const round = n => Math.round((n + Number.EPSILON) * 100) / 100;
const value = (n, min=0, max=1e9) => { n=Number(n); if(!Number.isFinite(n)||n<min||n>max)throw Error('Проверьте числовые значения');return n; };
const textValue = v => { const t=String(v??'').trim();if(!t)throw Error('Заполните обязательные поля');return t; };
const dateValue = d => { if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||new Date(d+'T12:00Z').toISOString().slice(0,10)!==d)throw Error('Неверная дата');return d; };
const get = (s,k,id) => { const v=s[k].find(x=>x.id===id);if(!v)throw Error('Запись не найдена: '+k);return v; };
function extendState(s){
 for(const k of ['sales','purchaseDocuments','payouts','workplaceShifts','bonusLedger','inventories','messageTemplates','outbox','schedulePatterns','expenseTemplates','supplierOrders','zones','holds'])s[k]??=[];
 s.paymentMethods??=[{id:'cash',name:'Наличные',kind:'cash',fee:0,active:true},{id:'card',name:'Терминал',kind:'card',fee:0,active:true},{id:'transfer',name:'Перевод',kind:'transfer',fee:0,active:true}];
 s.terminals??=[];
 s.settings={holdMinutes:10,requireConfirmation:false,allowClientCancel:true,lateCancelHours:24,loyaltyActive:true,productBonusPercent:0,bonusMaxPercent:30,bonusExpiryMonths:0,familyBonus:false,familyBonusRates:{},...s.settings};
 // Preserve earned balances from earlier versions without creating them twice.
 for(const a of s.appointments)if(a.status==='paid'&&!a.saleId&&a.bonusEarned>0&&!s.bonusLedger.some(e=>e.legacyId===a.id||e.saleId===a.saleId&&a.saleId))s.bonusLedger.push({id:uid(),legacyId:a.id,clientId:a.clientId,amount:a.bonusEarned,date:a.paidDate||a.date,expires:'',reason:'Начисление по прежнему чеку'});
}
function receipts(s){return [...s.appointments.filter(a=>!a.saleId),...s.sales];}
function payoutTotals(s,id,from,to){return (s.payouts||[]).filter(p=>p.employeeId===id&&p.date>=from&&p.date<=to).reduce((n,p)=>n+p.amount,0);}
function bonusBalance(s,clientId,date=today()) {return round(s.bonusLedger.filter(e=>e.clientId===clientId&&(!e.expires||e.expires>=date)).reduce((n,e)=>n+e.amount,0));}
function consume(s,productId,warehouseId,qty,reason,documentId){
 get(s,'products',productId);get(s,'warehouses',warehouseId);qty=value(qty,0.000001);
 if(stock(s,productId,warehouseId)+1e-8<qty)throw Error('Недостаточно товара: '+get(s,'products',productId).name);
 let left=qty,cost=0;const allocations=[];
 for(const lot of s.purchases.filter(p=>p.productId===productId&&(p.locations[warehouseId]||0)>0).sort((a,b)=>a.date.localeCompare(b.date))){
  const used=Math.min(lot.locations[warehouseId],left);lot.locations[warehouseId]-=used;lot.remaining-=used;left-=used;cost+=used*lot.cost;allocations.push({lotId:lot.id,warehouseId,qty:used});if(left<1e-8)break;
 }
 if(left>1e-8)throw Error('Остатки партий не совпадают с журналом');
 s.movements.push({id:uid(),date:today(),productId,warehouseId,qty:-qty,reason,documentId});return {cost,allocations};
}
function receive(s,b,documentId){
 get(s,'products',b.productId);get(s,'warehouses',b.warehouseId);
 const qty=value(b.qty,0.000001),cost=value(b.cost),date=dateValue(b.date),expires=b.expires?dateValue(b.expires):'';
 const lot={id:uid(),documentId,productId:b.productId,warehouseId:b.warehouseId,supplierId:b.supplierId||'',date,expires,qty,remaining:qty,cost,locations:{[b.warehouseId]:qty}};
 s.purchases.push(lot);s.movements.push({id:uid(),documentId,date,productId:b.productId,warehouseId:b.warehouseId,qty,reason:'Закупка'});return lot;
}
function moneyOut(s,amount,reason,method){
 if(method==='cash'){const sh=s.shifts.find(x=>!x.closedAt);if(!sh)throw Error('Откройте кассовую смену');if(cashBalance(s,sh)+1e-8<amount)throw Error('Недостаточно наличных');s.cash.push({id:uid(),shiftId:sh.id,date:today(),amount:-amount,reason});}
 else if(method!=='transfer')throw Error('Выберите наличные или перевод');
}
function notification(s,event,a){const template=s.messageTemplates.find(t=>t.event===event&&t.active);if(!template)return;const vars={client:a.name,service:a.service,date:a.date,time:a.time,salon:s.settings.name};const body=template.body.replace(/\{(\w+)\}/g,(all,k)=>vars[k]??all);s.outbox.push({id:uid(),date:today(),event,appointmentId:a.id,body,status:'Не отправлено — канал не подключён'});}

 if(action==='hold-slot'){

  s.holds=s.holds.filter(h=>h.expiresAt>Date.now());
  if(!slots(s,b.employeeId,b.serviceId,b.date,true,b.token).includes(b.time))throw Error('Это время уже занято');
  const service=get(s,'services',b.serviceId);s.holds=s.holds.filter(h=>h.token!==b.token);s.holds.push({token:b.token,employeeId:b.employeeId,serviceId:b.serviceId,date:b.date,time:b.time,start:mins(b.time),duration:service.duration,expiresAt:Date.now()+s.settings.holdMinutes*60000});
 }else if(action==='cancel-booking'){
  if(!/^[a-f0-9-]{36}$/.test(b.token||''))throw Error('Ссылка недействительна');const a=s.appointments.find(a=>a.manageToken===b.token);if(!a)throw Error('Запись не найдена');if(!s.settings.allowClientCancel)throw Error('Для отмены свяжитесь с салоном');if(!['pending','booked'].includes(a.status))throw Error('Запись уже закрыта');
  a.status='cancelled';a.cancelledAt=new Date().toISOString();a.lateCancellation=new Date(a.date+'T'+a.time+':00+04:00').getTime()-Date.now()<s.settings.lateCancelHours*3600000;notification(s,'cancelled',a);
 }else if(action==='schedule-pattern'){
  get(s,'employees',b.employeeId);const weekdays=(b.weekdays||[]).map(Number);if(!weekdays.length||weekdays.some(d=>!Number.isInteger(d)||d<0||d>6))throw Error('Выберите дни недели');
  const start=mins(b.start),end=mins(b.end);if(end<=start)throw Error('Проверьте рабочие часы');dateValue(b.from);dateValue(b.to);if(b.to<b.from||(new Date(b.to)-new Date(b.from))/86400000>366)throw Error('Период до 366 дней');
  if(!!b.breakStart!==!!b.breakEnd||b.breakStart&&(mins(b.breakStart)<start||mins(b.breakEnd)>end||mins(b.breakEnd)<=mins(b.breakStart)))throw Error('Проверьте перерыв');
  for(let d=new Date(b.from+'T12:00Z');d.toISOString().slice(0,10)<=b.to;d.setUTCDate(d.getUTCDate()+1)){
   if(!weekdays.includes(d.getUTCDay()))continue;const date=d.toISOString().slice(0,10),g={employeeId:b.employeeId,date,start:b.start,end:b.end,off:!!b.off,breakStart:b.breakStart||'',breakEnd:b.breakEnd||''};
   if(s.appointments.some(a=>a.employeeId===b.employeeId&&a.date===date&&!['cancelled','refunded'].includes(a.status)&&(g.off||a.start<start||a.start+a.duration>end||g.breakStart&&a.start<mins(g.breakEnd)&&a.start+a.duration>mins(g.breakStart))))throw Error('График конфликтует с визитом: '+date);
   s.schedules=s.schedules.filter(x=>x.employeeId!==b.employeeId||x.date!==date);s.schedules.push(g);

function downloadRows(rows,name){const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='SayYes-'+name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function bindExtended(){
 for(const [name,set] of [['receiptFrom',v=>receiptFrom=v],['receiptTo',v=>receiptTo=v],['receiptMethod',v=>receiptMethod=v],['receiptPlace',v=>receiptPlace=v]])document.querySelector(`[name="${name}"]`)?.addEventListener('change',e=>{set(e.target.value);render();});
 document.querySelector('[data-reset-receipts]')?.addEventListener('click',()=>{receiptFrom=receiptTo=receiptMethod=receiptPlace=filter=employee=query='';render();});
 document.querySelectorAll('[data-confirm-visit]').forEach(b=>b.onclick=async()=>{try{await post('appointment-confirm',{id:b.dataset.confirmVisit});}catch(e){toast(e.message);}});
 document.querySelector('[data-receipt-export]')?.addEventListener('click',()=>downloadRows([['date','client','items','status','amount','method'],...receiptList().map(a=>[a.paidDate||a.date,a.name,a.service,a.status,a.amount??a.price,a.method||''])],'receipts'));
 document.querySelector('[data-table-export]')?.addEventListener('click',()=>downloadRows([...document.querySelectorAll('main table tr')].map(tr=>[...tr.children].map(td=>td.textContent)),'report'));
 document.querySelector('[data-print]')?.addEventListener('click',()=>window.print());
}

let floorZone='',freeService='',freeDays=7;
const promoParam=new URLSearchParams(location.search).get('promo')||'';
function phaseTwoBody(){
 if(page==='slots')return freeSlotsPage();
 if(page==='promotions')return panel('Акции и ссылки записи',table(['Акция','Скидка','Период','Ссылка',''],state.promotions.map(p=>[esc(p.name),p.discount+'%',p.start+' — '+p.end,`<input readonly value="${esc(bookingLink('promo',p.id))}" aria-label="Ссылка акции">`,edit('promotions',p.id)])),add('promotions','Акция'))+notice('Ссылка сохраняет акцию в новой записи. При оплате связанной записи скидка применяется, если акция ещё действует.');

 if(page==='floor')return panel('План зала',`<div class="toolbar padded">${select('floorZone','Зона',[...new Set(state.workplaces.map(w=>w.zone||'Основной зал'))].map(name=>({id:name,name})),floorZone,true)}</div><div class="floor-plan" style="height:600px">${state.workplaces.filter(w=>!floorZone||(w.zone||'Основной зал')===floorZone).map(w=>`<button data-floor-item="${esc(w.id)}" style="left:${Math.min(85,w.x)}%;top:${Math.min(85,w.y)}%;touch-action:none;cursor:move" title="Перетащите для перемещения"><b>${esc(w.name)}</b><small>${esc(w.status||'Свободно')}</small></button>`).join('')}</div>`,add('workplaces','Место'))+notice('Перетащите место для сохранения положения. Для названия, зоны и статуса откройте карточку в «Рабочих местах». Статусы пока задаются вручную.');
 if(page==='expense-templates')return panel('Шаблоны базовых расходов',table(['Название','Позиции','Итого на услугу','По умолчанию',''],state.expenseTemplates.map(t=>[esc(t.name),t.lines.map(l=>esc(l.name)+': '+money(l.amount)).join('<br>'),money(t.total),t.isDefault?'Да':'Нет',btn('Изменить',`data-form="expense-template" data-id="${t.id}"`)+btn('Применить к услугам',`data-form="apply-expense-template" data-id="${t.id}"`)])),add('expense-template','Шаблон'))+notice('Шаблон по умолчанию подставляется для новой услуги. Применение к существующим услугам заменяет их базовые затраты только для будущих чеков.');
 if(page==='supplier-orders')return panel('Заказы поставщикам',table(['Дата','Поставщик','Состав','Статус'],state.supplierOrders.slice().reverse().map(o=>[o.date,nameOf('suppliers',o.supplierId),o.lines.map(l=>nameOf('products',l.productId)+' × '+l.qty).join('<br>'),esc(o.status)])),add('supplier-order','Заказ')+btn('CSV','data-table-export'))+notice('Заказы сохраняются как черновики и не отправляются поставщикам. Поступление оформляется отдельной закупкой.');
 if(page==='products')return panel('Товары',table(['Товар','Бренд','Остаток','Цена','Статус',''],state.products.filter(p=>(p.name+' '+p.brand+' '+p.sku).toLowerCase().includes(query.toLowerCase())&&(!filter||filter==='archive'&&p.active===false||filter==='active'&&p.active!==false)).map(p=>[esc(p.name),esc(p.brand),stock(state,p.id)+' '+esc(p.unit),money(p.price),p.active===false?'Архив':'Активен',edit('products',p.id)+btn(p.active===false?'Восстановить':'В архив',`data-archive-product="${p.id}" data-archived="${p.active!==false}"`)])),`<input id="search" placeholder="Название, бренд, штрихкод" value="${esc(query)}"><select id="filter">${[['','Все'],['active','Активные'],['archive','Архив']].map(([id,n])=>`<option value="${id}" ${filter===id?'selected':''}>${n}</option>`).join('')}</select>`+add('products','Товар')+add('writeoff','Списание')+add('supplier-order','Заказ поставщику')+add('purchase-document','Принять товар'));
 return null;
}
function openPhaseTwoForm(type,id=''){
 if(!['schedule-pattern','expense-template','apply-expense-template','supplier-order'].includes(type))return false;
 let f='',heading='';
 if(type==='schedule-pattern'){heading='Повторяющийся график';f=select('employeeId','Сотрудник',state.employees,employee)+field('from','С даты',day,'date','required')+field('to','По дату',addDays(day,30),'date','required')+field('start','Начало','10:00','time','required')+field('end','Окончание','20:00','time','required')+field('breakStart','Перерыв с','','time')+field('breakEnd','Перерыв до','','time')+check('off','Выходные дни',false)+['Вс','Пн','Вт','Ср','Чт','Пт','Сб'].map((n,i)=>check('weekday:'+i,n,i>0&&i<6)).join('');}
 if(type==='expense-template'){const t=state.expenseTemplates.find(t=>t.id===id);heading='Шаблон базовых расходов';f=field('name','Название',t?.name||'','text','required')+check('isDefault','По умолчанию для новых услуг',t?.isDefault)+`<label>Расходы: одна строка «Название; сумма»<textarea name="rows" required rows="6">${esc(t?.lines.map(l=>l.name+'; '+l.amount).join('\n')||'')}</textarea></label>`;}
 if(type==='apply-expense-template'){heading='Применить шаблон к услугам';f=notice('Базовые затраты выбранных услуг будут заменены суммой шаблона.')+state.services.map(v=>check('service:'+v.id,esc(v.name),false)).join('');}
 if(type==='supplier-order'){heading='Черновик заказа';f=select('supplierId','Поставщик',state.suppliers)+field('note','Примечание')+state.products.filter(p=>p.active!==false).map(p=>extNumber('product:'+p.id,esc(p.name)+' · остаток '+stock(state,p.id),0)).join('');}
 modal.innerHTML=`<div class="modal-heading"><h2>${heading}</h2>${btn('×','type="button" data-close')}</div><form>${f}<p class="form-error" role="alert"></p><button class="primary" type="submit">Сохранить</button></form>`;modal.querySelector('[data-close]').onclick=()=>modal.close();
 const form=modal.querySelector('form');form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;try{const b=Object.fromEntries(new FormData(form));form.querySelectorAll('[type=checkbox]').forEach(el=>b[el.name]=el.checked);if(id)b.id=id;
 if(type==='schedule-pattern')b.weekdays=Array.from({length:7},(_,i)=>i).filter(i=>b['weekday:'+i]);
 if(type==='expense-template')b.lines=b.rows.split('\n').filter(l=>l.trim()).map(l=>{const split=l.lastIndexOf(';');if(split<0)throw Error('Формат строки: название; сумма');return {name:l.slice(0,split),amount:l.slice(split+1).trim().replace(',','.')};});
 if(type==='apply-expense-template'){b.templateId=id;b.serviceIds=state.services.filter(v=>b['service:'+v.id]).map(v=>v.id);}
 if(type==='supplier-order')b.lines=state.products.filter(p=>Number(b['product:'+p.id])>0).map(p=>({productId:p.id,qty:Number(b['product:'+p.id])}));
 await post(type,b);modal.close();toast('Сохранено');}catch(err){form.querySelector('.form-error').textContent=err.message;}finally{button.disabled=false;}};modal.showModal();return true;
}
function bindPhaseTwo(){
 document.querySelector('[name=freeService]')?.addEventListener('change',e=>{freeService=e.target.value;render();});
 document.querySelector('[name=freeDays]')?.addEventListener('change',e=>{freeDays=Number(e.target.value);render();});
 document.querySelector('[data-share-slots]')?.addEventListener('click',()=>{const rows=collectFreeSlots();const text=state.settings.name+' — свободное время\n'+rows.map(r=>r.date+' · '+r.employee+' · '+r.times.join(', ')).join('\n')+'\nЗапись: '+bookingLink();modal.innerHTML='<h2>Текст для публикации</h2><textarea rows="15" style="width:100%" readonly>'+esc(text)+'</textarea>'+btn('Закрыть','data-close');modal.querySelector('[data-close]').onclick=()=>modal.close();modal.showModal();modal.querySelector('textarea').select();});

 document.querySelector('[name=floorZone]')?.addEventListener('change',e=>{floorZone=e.target.value;render();});
 document.querySelectorAll('[data-floor-item]').forEach(el=>{let start=null;el.onpointerdown=e=>{start={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);};el.onpointermove=e=>{if(!start)return;const rect=el.parentElement.getBoundingClientRect();el.style.left=Math.max(0,Math.min(85,(e.clientX-rect.left)/rect.width*100))+'%';el.style.top=Math.max(0,Math.min(85,(e.clientY-rect.top)/rect.height*100))+'%';};el.onpointerup=async()=>{if(!start)return;start=null;const w=state.workplaces.find(w=>w.id===el.dataset.floorItem);try{await post('workplaces',{...w,x:parseFloat(el.style.left),y:parseFloat(el.style.top)});}catch(err){toast(err.message);render();}};el.onpointercancel=()=>{start=null;render();};});
 document.querySelectorAll('[data-archive-product]').forEach(b=>b.onclick=async()=>{try{await post('archive-product',{id:b.dataset.archiveProduct,archived:b.dataset.archived==='true'});}catch(e){toast(e.message);}});
}

function bookingLink(key='',value=''){const preview=location.pathname.endsWith('.html');const base=location.origin+ (preview?location.pathname:'/book');return base+(key?'?'+key+'='+encodeURIComponent(value):'');}
function collectFreeSlots(){const serviceId=freeService||state.services.find(s=>s.active)?.id;if(!serviceId)return [];return Array.from({length:freeDays},(_,i)=>addDays(day,i)).flatMap(date=>state.employees.filter(e=>e.active&&(!employee||e.id===employee)).map(e=>({date,employee:e.name,times:slots(state,e.id,serviceId,date,true)}))).filter(r=>r.times.length);}
function freeSlotsPage(){const rows=collectFreeSlots();return panel('Свободные окна для публикации',table(['Дата','Мастер','Свободное время'],rows.map(r=>[r.date,esc(r.employee),r.times.join(' · ')])),dateControls()+select('freeService','Услуга',state.services.filter(s=>s.active),freeService)+select('freeDays','Период',[{id:'7',name:'7 дней'},{id:'14',name:'14 дней'}],String(freeDays))+btn('Поделиться','data-share-slots'))+notice('Слоты учитывают длительность выбранной услуги, графики, визиты и временные брони. Публикация не удерживает время: доступность проверяется повторно при записи.');}
function managementView(){const a=managedBooking;const url=location.href.split('?')[0]+'?manage='+encodeURIComponent(bookingManageToken);return panel('Ваша запись',a?`<div class="padded"><h3>${esc(a.service)}</h3><p>${esc(a.date)} · ${esc(a.time)}</p><p>${a.status==='pending'?'Ожидает подтверждения салоном':a.status==='cancelled'?'Запись отменена':a.status==='paid'?'Визит оплачен':a.status==='refunded'?'Возврат оформлен':'Запись подтверждена'}</p><p>Сохраните персональную ссылку для управления записью:</p><input readonly value="${esc(url)}" aria-label="Ссылка управления">${a.allowCancel&&['pending','booked'].includes(a.status)?btn('Отменить запись','data-public-cancel'):''}${btn('Новая запись','data-new-public')}</div>`:notice('Загружаем запись…'));}
async function fetchManagedBooking(){const r=await fetch('/api/manage-booking',{headers:{'X-Booking-Token':bookingManageToken}});const data=await r.json();if(!r.ok)throw Error(data.error);managedBooking=data;if(state)render();}
function bindManagement(){document.querySelector('[data-new-public]')?.addEventListener('click',()=>{bookingManageToken='';managedBooking=null;history.replaceState({},'',location.pathname);load().catch(e=>toast(e.message));});document.querySelector('[data-public-cancel]')?.addEventListener('click',async()=>{if(!confirm('Отменить вашу запись?'))return;try{await post('cancel-booking',{token:bookingManageToken});await fetchManagedBooking();}catch(err){toast(err.message);}});}
const managementParam=new URLSearchParams(location.search).get('manage');if(promoParam)page='book';if(managementParam){page='book';bookingManageToken=managementParam;fetchManagedBooking().catch(e=>toast(e.message));}

load().catch(e=>{app.innerHTML=`<p class="notice">Не удалось загрузить SayYes: ${esc(e.message)}. Обновите страницу или откройте самостоятельный предпросмотр.</p>`;});
})();</script></body></html>
