const btn=(label,attrs='',cls='secondary')=>`<button class="${cls}" ${attrs}>${label}</button>`;
const opts=(items,value='',empty=false)=>`${empty?'<option value="">Не выбрано</option>':''}${items.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('')}`;

function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('visible');setTimeout(()=>el.classList.remove('visible'),4000);}
async function load(){if(!isStandalone&&new URLSearchParams(location.hash.slice(1)).has('invite')){await authenticationScreen();return;}const r=await fetch(page==='book'?'/api/public-state':'/api/state',{headers:{'X-Booking-Hold':bookingHold}});if(r.status===401){state=null;currentSession=null;await authenticationScreen();return;}if(!r.ok)throw Error('Сервер недоступен');state=upgrade(await r.json());if(state.sessionUser)currentSession=state.sessionUser;if(page!=='book'&&!canViewPage(page)){page=firstAllowed();if(!page){app.innerHTML='<main class="auth-main"><section class="auth-card"><h1>Доступ ограничен</h1><p>Владелец ещё не разрешил просмотр разделов.</p>'+btn('Выйти','data-auth-logout')+'</section></main>';bindAccess();return;}}render();}
async function post(action,b){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const data=await r.json();if(!r.ok)throw Error(data.error);await load();}
function go(id){if(page!=='book'&&id!=='book'&&!isStandalone){id=allowedDestination(id);if(!id){toast('Раздел недоступен');return;}}const reload=page==='book'||id==='book';page=id;tab='';filter='';query='';selectedClient='';sourceFilter='';tagFilter='';if(reload)load().catch(e=>toast(e.message));else render();}
function stats(items){return `<div class="stats">${items.map(([label,value,sub])=>`<article><span>${label}</span><h2>${value}</h2><small>${sub||''}</small></article>`).join('')}</div>`;}
function dateControls(){return `<div class="toolbar">${btn('←','data-shift="-1"')}${btn('Сегодня','data-today')}${btn('→','data-shift="1"')}<input id="day" type="date" value="${day}" aria-label="Дата"><select id="employee-filter" aria-label="Мастер"><option value="">Все мастера</option>${opts(state.employees,employee)}</select></div>`;}
function appointmentRows(list){return table(['Дата / время','Клиент / услуга','Мастер','Сумма','Статус'],list.map(a=>[`${esc(a.date)}<small>${esc(a.time)} · ${a.duration} мин</small>`,`${esc(a.name)}<small>${esc(a.service)}</small>`,nameOf('employees',a.employeeId),money(a.amount??a.price),a.status==='booked'?`${btn('Оплатить',`data-form="payment" data-id="${a.id}"`)} ${btn('Отменить',`data-cancel="${a.id}"`)}`:`<span class="badge ${a.status}">${({paid:'Оплачено',pending:'На подтверждении',refunded:'Возврат',cancelled:'Отменено'})[a.status]||a.status}</span>`]));}
function calendar(){let dates=[day];if(view==='week')dates=Array.from({length:7},(_,i)=>addDays(day,i));if(view==='month'){const count=new Date(Number(day.slice(0,4)),Number(day.slice(5,7)),0).getDate();return `<div class="month-grid">${Array.from({length:count},(_,i)=>{const d=day.slice(0,8)+String(i+1).padStart(2,'0');const list=state.appointments.filter(a=>a.date===d&&a.status!=='cancelled'&&(!employee||a.employeeId===employee));return `<button data-day="${d}"><b>${i+1}</b><small>${list.length} записей</small>${list.slice(0,3).map(a=>`<span>${esc(a.time)} ${esc(a.name)}</span>`).join('')}</button>`;}).join('')}</div>`;}
 const emps=state.employees.filter(e=>e.active&&(!employee||e.id===employee));return dates.map(d=>`<h3 class="date-label">${esc(d)}</h3><div class="calendar-scroll"><div class="calendar-grid" style="grid-template-columns:60px repeat(${emps.length},minmax(150px,1fr))"><div class="calendar-title">Время</div>${emps.map(e=>`<div class="calendar-title">${esc(e.name)}<small>${schedule(state,e.id,d).off?'Выходной':schedule(state,e.id,d).start+'–'+schedule(state,e.id,d).end}</small></div>`).join('')}<div class="time-axis">${Array.from({length:24},(_,i)=>`<span style="top:${i*60}px">${time(i*60)}</span>`).join('')}</div>${emps.map(e=>{const g=schedule(state,e.id,d);return `<div data-calendar-employee="${e.id}" data-calendar-date="${d}" class="calendar-column ${g.off?'off':''}">${!g.off?`<div class="work-band" style="top:${parseTime(g.start)}px;height:${parseTime(g.end)-parseTime(g.start)}px"></div>`:''}${!g.off?scheduleBreaks(g).map(br=>`<div class="break-band" style="top:${scheduleMinutes(br.start)}px;height:${scheduleMinutes(br.end)-scheduleMinutes(br.start)}px">Перерыв</div>`).join(''):''}${state.appointments.filter(a=>a.date===d&&a.employeeId===e.id&&a.status!=='cancelled').map(a=>`<button class="appointment ${a.status}" style="top:${a.start}px;height:${Math.max(26,a.duration)}px" data-visit="${a.id}"><b>${esc(a.time)} · ${esc(a.name)}</b><small>${esc(a.service)} · ${money(a.amount??a.price)}</small></button>`).join('')}</div>`;}).join('')}</div></div>`).join('');}
const parseTime=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
function addDays(d,n){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);}
function recommendations(){const low=state.products.filter(p=>stock(state,p.id)<=p.threshold),unpaid=state.appointments.filter(a=>a.status==='booked'&&a.date<today());return `<div class="recommendations">${low.length?`<article><h3>${low.length} товаров требуют пополнения</h3>${btn('Открыть склад','data-page="stock"')}</article>`:''}${unpaid.length?`<article><h3>${unpaid.length} прошедших визитов не закрыто</h3>${btn('Проверить чеки','data-page="receipts"')}</article>`:''}${!state.employees.some(e=>e.commission>0)?`<article><h3>Укажите проценты начисления зарплаты</h3><p>Сейчас у всех мастеров ставка 0%.</p>${btn('Настроить команду','data-page="employees"')}</article>`:''}<article><h3>Проверьте графики мастеров</h3><p>По умолчанию используется график 10:00–20:00 без выходных.</p>${btn('Настроить','data-page="schedule"')}</article></div>`;}
function clientFilters(){return `<select id="source-filter" aria-label="Источник"><option value="">Все источники</option>${opts([...new Set(state.clients.map(c=>c.source))].map(n=>({id:n,name:n})),sourceFilter)}</select><select id="tag-filter" aria-label="Тег"><option value="">Все теги</option>${opts([...new Set(state.clients.flatMap(c=>c.tags.split(',').map(t=>t.trim()).filter(Boolean)))].map(n=>({id:n,name:n})),tagFilter)}</select>`;}
